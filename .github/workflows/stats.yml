name: Update GitHub stats

on:
  schedule:
    - cron: "10 3 * * *"
  push:
    paths:
      - ".github/workflows/stats.yml"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          AUTO_PUSH: false

      - name: Save stats card
        run: |
          cp profile-summary-card-output/github_dark/3-stats.svg profile/stats.svg
          rm -rf profile-summary-card-output
          # Match the black-ice palette used by the streak card
          sed -i \
            -e 's/#0d1117/#151515/g' \
            -e 's/#0366d6/#00E7FF/g' \
            -e 's/#77909c/#FFFFFF/g' \
            -e 's/#8b949e/#00E7FF/g' \
            -e 's/#2e343b/#151515/g' \
            profile/stats.svg

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update GitHub stats" || exit 0
          git pull --rebase
          git push
