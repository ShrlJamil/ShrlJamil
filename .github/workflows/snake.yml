name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?color_snake=#39d353

      - name: Generate snake SVG (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake.svg profile/github-snake-dark.svg
          git commit -m "Update snake" || exit 0
          git pull --rebase
          git push
