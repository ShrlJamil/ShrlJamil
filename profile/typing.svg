<svg xmlns="http://www.w3.org/2000/svg" width="540" height="34" viewBox="0 0 540 34">
  <style>
    .t {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 18px;
      fill: #F75C7E;
    }
    .cur {
      fill: #F75C7E;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0 } }

    @keyframes w0 {
      0%   { width: 0; animation-timing-function: steps(23) }
      23%  { width: 248.4px; animation-timing-function: linear }
      30%  { width: 248.4px }
      100% { width: 0 }
    }
    @keyframes w1 {
      0%   { width: 0 }
      30%  { width: 0; animation-timing-function: steps(22) }
      52%  { width: 237.6px; animation-timing-function: linear }
      60%  { width: 237.6px }
      100% { width: 0 }
    }
    @keyframes w2 {
      0%   { width: 0 }
      60%  { width: 0; animation-timing-function: steps(20) }
      80%  { width: 216px; animation-timing-function: linear }
      90%  { width: 216px }
      100% { width: 0 }
    }

    @keyframes g0 {
      0%, 30%   { opacity: 1 }
      30.1%, 100% { opacity: 0 }
    }
    @keyframes g1 {
      0%, 30%   { opacity: 0 }
      30.1%, 60%  { opacity: 1 }
      60.1%, 100% { opacity: 0 }
    }
    @keyframes g2 {
      0%, 60%   { opacity: 0 }
      60.1%, 90%  { opacity: 1 }
      90.1%, 100% { opacity: 0 }
    }

    .g0 { animation: g0 12s infinite; }
    .g1 { animation: g1 12s infinite; }
    .g2 { animation: g2 12s infinite; }

    .w0 { animation: w0 12s infinite; }
    .w1 { animation: w1 12s infinite; }
    .w2 { animation: w2 12s infinite; }
  </style>

  <defs>
    <clipPath id="c0"><rect class="w0" x="0" y="0" width="248.4" height="34"/></clipPath>
    <clipPath id="c1"><rect class="w1" x="0" y="0" width="237.6" height="34"/></clipPath>
    <clipPath id="c2"><rect class="w2" x="0" y="0" width="216" height="34"/></clipPath>
  </defs>

  <g class="g0">
    <text class="t" x="0" y="24" clip-path="url(#c0)">Fullstack Web Developer</text>
    <rect class="cur" x="252.4" y="5" width="2.5" height="22"/>
  </g>
  <g class="g1">
    <text class="t" x="0" y="24" clip-path="url(#c1)">Arch Linux Enthusiast</text>
    <rect class="cur" x="241.6" y="5" width="2.5" height="22"/>
  </g>
  <g class="g2">
    <text class="t" x="0" y="24" clip-path="url(#c2)">Flutter &amp; ML Learner</text>
    <rect class="cur" x="220" y="5" width="2.5" height="22"/>
  </g>
</svg>
